[platformio]
src_dir = .
default_envs = garchomp, giratina, metagross

[env]
build_src_filter = +<dsh_dex.ino.cpp>
platform = espressif32@6.12.0
; This profile supplies the ESP32-C3 and 4 MB flash settings for the bare module.
board = esp32-c3-devkitm-1
framework = arduino
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=0
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    adafruit/Adafruit SSD1306@2.5.13
    adafruit/Adafruit GFX Library@1.12.1
    adafruit/Adafruit BusIO@1.17.2

[env:garchomp]
build_flags = ${env.build_flags} -DDSH_DEX_WIRE_ID=1

[env:giratina]
build_flags = ${env.build_flags} -DDSH_DEX_WIRE_ID=4

[env:metagross]
build_flags = ${env.build_flags} -DDSH_DEX_WIRE_ID=5
